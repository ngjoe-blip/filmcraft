name: Build Windows x64

on:
  push:
    branches: [chinese]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (MSI & Portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout craft-fonts
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
          path: craft-fonts

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: build-windows-x64

      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build, sign and package
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}\craft-fonts
        run: ./packaging/windows/package.ps1 -Arch x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: filmcraft-0.4.0-windows-x64
          path: dist/release/*
          if-no-files-found: error

      - name: Publish to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v0.4.0-chinese"
          title="FilmCraft v0.4.0 (Simplified Chinese)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/release/* --clobber
          else
            gh release create "$tag" dist/release/* --title "$title" --notes "FilmCraft 0.4.0 Windows x64 installer and portable zip with Simplified Chinese support." --prerelease
          fi
